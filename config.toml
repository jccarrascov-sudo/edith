# edith configuration. All times are in seconds unless noted.

[capture]
interval_s = 2.0          # how often the primary monitor is grabbed
change_threshold = 0.02   # mean abs diff (0-1) on a 64x36 grayscale thumbnail to save a frame
max_idle_s = 30           # save a frame anyway if nothing was saved for this long
jpeg_quality = 70
max_width = 1280
burst_interval_s = 0.5    # after a click, capture this often...
burst_s = 3.0             # ...for this long

[audio]
enabled = true
block_s = 15              # length of each loopback block sent to whisper
silence_rms = 0.003       # blocks quieter than this (~ -50 dBFS) are not transcribed
model = "small"
device = "cuda"           # falls back to cpu automatically
compute_type = "int8"
keep_wav = true           # keep non-silent blocks in buffer/audio (rotated like frames)

[retention]
minutes = 10              # nothing older than this is kept in buffer/
prune_every_s = 5

[ask]
max_frames = 12
recent_frames = 3         # always include the N most recent frames
image_width = 1280        # width of the current (newest) frame; older ones decay from here
history_scales = [1.0, 0.75, 0.5]   # newest, previous, all older frames (see docs/ARCHITECTURE.md)
diff_crops = true         # older frames: send only the region that changed
diff_crop_max_area = 0.6  # if more than this fraction changed, send the whole frame
max_output_tokens = 4000   # includes reasoning tokens
reasoning_effort = "low"   # minimal | low | medium | high | xhigh | max

[ui]
language = "en"           # en | es (neutral Spanish): the panel's texts

[network]
# Sites where a machine may skip the browser and send the form's request directly (its
# network level, verified like the page level). Anything else always runs in the browser.
allow = ["127.0.0.1", "localhost"]

[budget]
session_limit_usd = 5.0   # calls stop when a session costs more than this
session_idle_hours = 3    # a new session starts after this long without API calls
monthly_limit_usd = 10.0  # at 80 % the panel warns; at 100 % Edith answers locally only
warn_at = 0.8
input_per_m = 1.25        # Muse Spark prices, USD per million tokens
cached_per_m = 0.15
output_per_m = 4.25

[cloud]
# Muse Spark is only called when you ask something. Text goes first (screen text, notes,
# transcript); screenshots only if the question needs to see something.
max_images = 3
image_width = 1024        # the newest screenshot sent; older ones are smaller
older_image_width = 640
confirm_images = false    # ask before sending screenshots
timeout_s = 90
max_output_tokens = 2000  # includes reasoning tokens

[local]
# Muse Glimmer 30B through llama.cpp's llama-server (found automatically if installed with
# winget and downloaded to the Hugging Face cache). Used for background notes and whenever
# the cloud is not used.
enabled = true
gpu_layers = 6            # ~2 GB of VRAM (26 layers: ~6 GB, ~1.6x faster)
context = 8192
port = 0                  # 0 = a free port each time
timeout_s = 120

[archive]
# The day's text: what windows showed, what was heard, field values, and short descriptions
# of screens with little text. Screenshots and audio are still deleted after 10 minutes.
# Local only; a question sends only the lines that match it.
keep_hours = 24
describe_every_s = 300      # at most one screenshot description by the local model this often
describe_below_chars = 150  # ...and only of screens with less readable text than this
max_chars_cloud = 4000      # archive lines a question may send
max_chars_local = 2500

[notes]
# Background notes by the local model: block summaries and key moments (slide changes,
# dates/deadlines/tasks, "this is in the exam"). Local text only. Important moments are kept a year.
enabled = true
summary_minutes = 10
check_s = 30
keep_hours = 24           # slide changes and block summaries
important_keep_days = 365 # dates, deadlines, tasks, appointments, "this is in the exam"

# If the foreground window matches any of these (case-insensitive substring),
# nothing is captured: no frame, no window title, no process name.
[exclude]
titles = [
    "keepass", "1password", "bitwarden", "lastpass", "dashlane", "proton pass",
    "banca", "bank", "bcp", "interbank", "bbva", "scotiabank", "banco",
    "paypal", "incognito", "inprivate",
]
processes = [
    "keepass.exe", "keepassxc.exe", "1password.exe", "bitwarden.exe",
]

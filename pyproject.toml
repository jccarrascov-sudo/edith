[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edith"
version = "0.1.0"
description = "A minimal desktop assistant that remembers the last minutes of your screen and audio."
requires-python = ">=3.12"
dependencies = [
    "mss",
    "Pillow",
    "numpy",
    "PyAudioWPatch",
    "faster-whisper",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "openai",
    "python-dotenv",
    "uiautomation",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "openpyxl",
    "meta-sam-parser",
    "playwright",
    "PySide6-Essentials",
]

[project.scripts]
edith = "edith.__main__:main"

[project.gui-scripts]
edith-ui = "edith.ui.app:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"edith.ui" = ["fonts/*.ttf", "fonts/OFL.txt"]

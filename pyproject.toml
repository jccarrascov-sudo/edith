[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pantallita"
version = "0.1.0"
description = "An on-screen companion that remembers the last minutes of your screen and audio."
requires-python = ">=3.12"
dependencies = [
    "mss",
    "Pillow",
    "numpy",
    "PyAudioWPatch",
    "faster-whisper",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "openai",
    "python-dotenv",
    "uiautomation",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "openpyxl",
    "meta-sam-parser",
    "playwright",
    "PySide6-Essentials",
]

[tool.setuptools.packages.find]
where = ["src"]

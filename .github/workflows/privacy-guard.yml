name: privacy-guard

# Fails if anything private is tracked: secrets files, capture data or local databases.
on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No secrets, capture data or databases in the repository
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)buffer/|\.(wav|sqlite|sqlite3|db)$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "Private files are tracked:"; echo "$bad"; exit 1
          fi
          echo "OK: no .env, buffer/ or database files tracked."
